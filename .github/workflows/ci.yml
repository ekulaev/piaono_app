name: Checks

# Те же проверки, что перед деплоем, но на каждом PR: ошибка видна до слияния.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # Сайт-лендинг (C-LAUNCH-1): сборка и проверки hreflang, размеров, чужих ресурсов.
      - run: npm run site:build
      - run: npm run site:check
