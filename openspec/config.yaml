schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: тренажёр чтения нот с листа (PWA, React + TypeScript + Vite), пианино по USB-MIDI,
  Chrome на Android-планшете, хостинг GitHub Pages (base /piaono_app/). Полные правила — CLAUDE.md.
  Приоритеты строго по порядку: 1) надёжность MIDI-соединения; 2) читаемость при слабом зрении
  (контраст 7:1, текст ≥ 18px, цели касания ≥ 56px, без декоративной анимации);
  3) понятность кода; 4) простота MVP.
  Архитектура: слои midi/ → engine/ → ui/, UI не трогает сырой Web MIDI.
  Без бэкенда, аккаунтов, аналитики. Каждая новая зависимость обосновывается.
  Один change = одна спецификация из PSD (или её часть) = один небольшой PR.
  Каждый change описывает, как владелец проверит результат на планшете с пианино.
  Источник требований — спецификации компонентов в PSD/specifications/M-XX/C-XX-N *.md
  (процесс — PSD/README.md). Proposal ссылается на путь спецификации; решения, принятые по ходу
  работы, вносятся в спецификацию тем же PR, паспорт модуля — при архивации.
  Спецификация со статусом closed не редактируется совсем: изменение её поведения описывает новая
  спецификация (блок «Меняет закрытые спецификации»). Идеи и отложенное — в PSD/Беклог идей.md.
  Как устроено приложение сейчас — docs/architecture/ (C4); design.md опирается на него.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

operations:
  archive:
    guidance:
      - >-
        Закрыть спецификацию change'а (PSD/README.md, «Закрытая спецификация»): статус closed в шапке
        и под шапкой пометка «Закрыта <дата>: текст не редактируется. Реализация — change <имя>.
        Актуальное поведение — openspec/specs/ (<capability>); кто менял его позже — колонка
        «Изменена в» паспорта модуля». Это последняя правка файла спецификации.
      - >-
        Паспорт модуля: реализация «реализована, change <имя>», статус спецификации closed,
        «Capability OpenSpec» заполнена. Для каждой закрытой спецификации, чью capability меняет
        этот change, дописать код этой спецификации в колонку «Изменена в» её паспорта. Сами
        закрытые спецификации не править.
      - >-
        PSD/Беклог идей.md: идея этой спецификации — «сделана, C-XX-N», строка переезжает в раздел
        «Сделано»; то, что спецификация вынесла «Вне Scope» как «потом», добавить новыми идеями.
      - >-
        docs/architecture/ (README, раздел «Когда обновлять»): новая функция — строка в карте
        функций README; новый или перенесённый модуль, смена зависимостей слоёв — «C3 Компоненты»;
        новое поле localStorage — «Данные»; изменённый путь данных или внешняя связь — «Сценарии»,
        C1 или C2. Если ничего из этого change не трогал, документация не меняется.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
