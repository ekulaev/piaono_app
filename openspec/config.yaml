schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: тренажёр чтения нот с листа (PWA, React + TypeScript + Vite), пианино по USB-MIDI,
  Chrome на Android-планшете, хостинг GitHub Pages (base /piaono_app/). Полные правила — CLAUDE.md.
  Приоритеты строго по порядку: 1) надёжность MIDI-соединения; 2) читаемость при слабом зрении
  (контраст 7:1, текст ≥ 18px, цели касания ≥ 56px, без декоративной анимации);
  3) понятность кода; 4) простота MVP.
  Архитектура: слои midi/ → engine/ → ui/, UI не трогает сырой Web MIDI.
  Без бэкенда, аккаунтов, аналитики. Каждая новая зависимость обосновывается.
  Один change = один пункт плана из CLAUDE.md = один небольшой PR.
  Каждый change описывает, как владелец проверит результат на планшете с пианино.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
